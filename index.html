<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Training</title>
<meta name="description" content="ブラウザ内の SQLite で SQL を実行する練習アプリ">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
  :root{
    --bg:#f6f6f4; --paper:#fff; --line:#e4e4e0; --ink:#1c1c1a; --muted:#6b6b66;
    --blue:#1d4ed8; --blue-bg:#eaf1ff; --green:#0f7a4d; --green-bg:#e7f6ee;
    --amber:#b45309; --amber-bg:#fff3df; --red:#b91c1c; --red-bg:#fdecec; --gray-bg:#efefec;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Segoe UI",sans-serif;font-size:15px;line-height:1.6}
  button{font:inherit;cursor:pointer;color:inherit}
  button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  a{color:var(--blue);text-decoration:none}
  code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  h1,h2,h3,h4{margin:0;line-height:1.3}
  #app{min-height:100vh}
  .loading{display:grid;place-items:center;height:100vh;color:var(--muted)}

  /* buttons */
  .btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 14px;font-weight:600}
  .btn:hover{background:#f3f3f0}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.primary:hover{background:#1a44bf}
  .btn.danger{color:var(--red);border-color:#f3c4c4;background:#fff6f6}
  .btn.danger:hover{background:#fdecec}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn.sm{padding:5px 10px;font-size:13px}
  .btn:disabled{opacity:.5;cursor:default}

  /* pills */
  .pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
  .lv0{background:var(--green-bg);color:var(--green);border:1px solid #bfe6cf}
  .lv1{background:var(--amber-bg);color:var(--amber);border:1px solid #f4d9ad}
  .lv2{background:var(--red-bg);color:var(--red);border:1px solid #f2bcbc}
  .p-score{background:var(--blue-bg);color:var(--blue)}
  .p-done{background:var(--green-bg);color:var(--green)}
  .p-todo{background:var(--gray-bg);color:var(--muted)}

  /* login */
  .login{max-width:420px;margin:12vh auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:32px}
  .login h1{font-size:28px;margin-bottom:6px}
  .login p{color:var(--muted);margin:0 0 20px}
  .field{display:block;margin-bottom:14px}
  .field span{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
  .field input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit}

  /* header */
  .top{background:var(--paper);border-bottom:1px solid var(--line)}
  .top .in{max-width:1280px;margin:0 auto;padding:22px 28px;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .top h1{font-size:28px;font-weight:800}
  .top .sub{color:var(--muted);font-size:14px;margin-top:4px}
  .nav{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .nav .who{color:var(--muted);font-size:14px}
  .nav .who b{color:var(--ink);font-weight:600}

  /* home layout */
  .home{max-width:1280px;margin:0 auto;padding:24px 28px;display:grid;grid-template-columns:320px 1fr;gap:28px;align-items:start}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:12px}
  .status{padding:22px;position:sticky;top:20px}
  .status .lbl{font-size:14px;font-weight:700;color:var(--muted)}
  .lvrow{display:flex;justify-content:space-between;align-items:flex-end;margin-top:6px}
  .lvbig{font-size:46px;font-weight:800;color:var(--blue);line-height:1}
  .lvmax{font-size:13px;color:var(--muted);margin-top:6px}
  .left{ text-align:right}
  .left .n{font-size:28px;font-weight:800;line-height:1.1}
  .left .t{font-size:13px;color:var(--muted)}
  .avatar{margin:22px auto;width:180px;height:230px;border-radius:12px;position:relative;overflow:hidden;background:linear-gradient(160deg,#e9eef9 0%,#cfd9f2 45%,#1d4ed8 46%,#173aa6 100%);display:grid;place-items:center}
  .avatar .init{font-size:96px;font-weight:800;color:#fff;letter-spacing:-.04em;text-shadow:0 2px 10px rgba(0,0,0,.25);margin-top:70px}
  .avatar .badge{position:absolute;top:10px;right:10px;background:#fff;color:var(--blue);font-weight:800;font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid #cfd9f2}
  .next{background:var(--blue-bg);border:1px solid #cfd9f2;border-radius:10px;text-align:center;padding:16px}
  .next .t{color:var(--blue);font-weight:700;font-size:14px}
  .next .n{font-size:44px;font-weight:800;color:var(--blue);line-height:1.1}
  .next .n small{font-size:16px;margin-left:4px}
  .prog{margin-top:22px}
  .prog .n{font-size:30px;font-weight:800}
  .prog .n small{font-size:15px;color:var(--muted);font-weight:600;margin-left:4px}
  .bar{height:8px;background:var(--gray-bg);border-radius:999px;overflow:hidden;margin:10px 0}
  .bar i{display:block;height:100%;background:#0f7a4d;border-radius:999px;transition:width .3s}
  .note{font-size:13px;color:var(--muted)}
  hr{border:0;border-top:1px solid var(--line);margin:18px 0}
  .reset-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:10px}

  .listhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
  .listhead h2{font-size:26px;font-weight:800}
  .listhead .cnt{color:var(--muted);font-size:14px}
  .sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 12px}
  .sec h3{font-size:20px;font-weight:800}
  .sec span{color:var(--muted);font-size:14px}
  .prob{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:10px}
  .prob:hover{border-color:#b9c6ea;background:#fbfcff}
  .prob.cur{border-color:var(--blue)}
  .prob .r1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .prob .num{color:var(--muted);font-size:14px}
  .prob .ttl{font-weight:800;font-size:17px}
  .prob .r2{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:6px}
  .prob .desc{color:#3d3d39;font-size:14px}
  .prob .st{display:flex;gap:6px;flex-shrink:0}
  .empty{color:var(--muted);padding:30px;text-align:center;border:1px dashed var(--line);border-radius:10px}

  /* problem page */
  .pbar{background:var(--paper);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .pbar .ttl{font-size:20px;font-weight:800}
  .pbar .sc{font-size:13px;color:var(--muted)}
  .pbar .sp{flex:1}
  .pbar .who{color:var(--muted);font-size:14px}
  .work{display:grid;grid-template-columns:340px 1fr 380px;height:calc(100vh - 62px);min-height:560px}
  .col{overflow:auto;padding:18px 20px}
  .col.l{background:var(--paper);border-right:1px solid var(--line)}
  .col.r{background:var(--paper);border-left:1px solid var(--line)}
  .col.c{padding:0;display:flex;flex-direction:column;background:#212121}
  .col h4{font-size:15px;font-weight:800;color:var(--muted);margin-bottom:8px}
  .statement{font-size:15px;line-height:1.8;margin-bottom:14px;white-space:pre-wrap}
  .hint{border:1px solid #f4d9ad;background:#fffaf0;border-radius:10px;padding:12px 14px;margin:16px 0}
  .hint .h{display:flex;justify-content:space-between;align-items:center;color:var(--amber);font-weight:800;font-size:17px}
  .hint .body{margin-top:8px;font-size:14px;line-height:1.7;display:none}
  .hint.open .body{display:block}
  .tbl{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px;background:var(--paper)}
  .tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:left;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .tbl th{background:#f4f4f1;font-weight:700}
  .tname{font-size:13px;font-weight:700;margin:12px 0 4px}
  .ed-head{color:#cfcfcf;font-size:14px;font-weight:700;padding:10px 16px;border-bottom:1px solid #333}
  .ed-wrap{flex:1;min-height:0}
  /* editor theme (inline so it always loads) */
  .cm-s-sqlx.CodeMirror{background:#1f1f1f;color:#d4d4d4}
  .cm-s-sqlx .CodeMirror-gutters{background:#1f1f1f;border-right:1px solid #2a2a2a}
  .cm-s-sqlx .CodeMirror-linenumber{color:#6e7681}
  .cm-s-sqlx .CodeMirror-cursor{border-left:2px solid #fff}
  .cm-s-sqlx .CodeMirror-selected,.cm-s-sqlx .CodeMirror-focused .CodeMirror-selected{background:rgba(38,79,120,.7)}
  .cm-s-sqlx .CodeMirror-activeline-background{background:rgba(255,255,255,.04)}
  .cm-s-sqlx .cm-comment{color:#6a9955;font-style:italic}
  .cm-s-sqlx .cm-keyword{color:#569cd6;font-weight:700}
  .cm-s-sqlx .cm-builtin{color:#dcdcaa}
  .cm-s-sqlx .cm-string{color:#ce9178}
  .cm-s-sqlx .cm-number{color:#b5cea8}
  .cm-s-sqlx .cm-operator{color:#d4d4d4}
  .cm-s-sqlx .cm-variable{color:#9cdcfe}
  .cm-s-sqlx .cm-variable-2{color:#4ec9b0}
  .cm-s-sqlx .cm-punctuation{color:#d4d4d4}
  .CodeMirror{height:100%;font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ed-foot{padding:8px 16px;border-top:1px solid #333;color:#9a9a9a;font-size:12px;display:flex;justify-content:space-between}
  .score{font-size:44px;font-weight:800;line-height:1;margin:6px 0 16px}
  .score small{font-size:16px;margin-left:2px}
  .chk{border-radius:10px;padding:12px 14px;margin-bottom:10px;border:1px solid}
  .chk.ok{background:var(--green-bg);border-color:#bfe6cf}
  .chk.ng{background:var(--red-bg);border-color:#f2bcbc}
  .chk .h{font-weight:800;font-size:15px}
  .chk.ok .h{color:var(--green)} .chk.ng .h{color:var(--red)}
  .chk .kv{background:rgba(255,255,255,.7);border-radius:8px;padding:6px 10px;margin-top:8px;font-size:13px}
  .chk .kv b{margin-right:6px}
  .chk .m{font-size:13px;margin-top:6px}
  .err{background:var(--red-bg);border:1px solid #f2bcbc;border-radius:10px;padding:12px 14px;color:var(--red);font-size:13px;white-space:pre-wrap}
  .out{background:#111;color:#f1f1f1;border-radius:10px;padding:12px 14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;white-space:pre;overflow:auto;margin-bottom:12px}
  .placeholder{color:var(--muted);font-size:14px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c1c1a;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}

  /* textbook / playground */
  .page{max-width:900px;margin:0 auto;padding:28px}
  .page h2{font-size:26px;font-weight:800;margin-bottom:16px}
  .lesson{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
  .lesson h3{font-size:18px;font-weight:800;margin-bottom:8px}
  .lesson pre{background:#212121;color:#eee;padding:12px 14px;border-radius:8px;overflow:auto;font-size:13px;margin:8px 0}
  .lesson p{margin:6px 0;font-size:14px}
  .pg{display:grid;grid-template-columns:1fr 380px;height:calc(100vh - 62px)}
  .pg .col.c{background:#212121}

  /* courses */
  .tabs{display:flex;gap:8px;flex-wrap:wrap;width:100%;margin-top:14px}
  .tab{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 16px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
  .tab:hover{background:#f3f3f0}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tab small{font-weight:600;color:var(--muted);font-size:12px}
  .tab.on small{color:#cfcfcf}
  .soon{font-size:11px;background:var(--amber-bg);color:var(--amber);border-radius:999px;padding:1px 8px;font-weight:700}
  .soon-box{background:var(--amber-bg);border:1px solid #f4d9ad;color:var(--amber);border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:16px}
  .code{background:#1f1f1f;color:#d4d4d4;border-radius:10px;padding:12px 14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;white-space:pre;overflow:auto;margin:6px 0 14px;line-height:1.55}
  .req{list-style:none;padding:0;margin:0 0 14px}
  .req li{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
  .req li::before{content:"☐  ";color:var(--muted)}
  .preview{width:100%;height:340px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .page .tabs{margin:0 0 18px}
  @media (max-width:1000px){
    .home{grid-template-columns:1fr}
    .status{position:static}
    .work{grid-template-columns:1fr;height:auto}
    .col{max-height:none}
    .col.c{min-height:320px}
    .pg{grid-template-columns:1fr;height:auto}
  }
  @media (prefers-reduced-motion:reduce){.bar i,.toast{transition:none}}
</style>
</head>
<body>
<div id="app"><div class="loading">読み込み中...</div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script>
/* ===================== DATA ===================== */
const SEED = `
CREATE TABLE departments (id INTEGER PRIMARY KEY, name TEXT);
CREATE TABLE employees (id INTEGER PRIMARY KEY, name TEXT, dept_id INTEGER, salary INTEGER, age INTEGER);
INSERT INTO departments VALUES (1,'Sales'),(2,'Engineering'),(3,'HR');
INSERT INTO employees VALUES
 (1,'Alice',1,5000,30),
 (2,'Bob',1,4000,25),
 (3,'Carol',2,7000,35),
 (4,'Dave',2,6000,40),
 (5,'Eve',3,4500,28);`;
const SUPPORT = "INSERT INTO departments VALUES (4,'Support');";

const SECTIONS = [
  [1,35,"1. SELECT の基本"],
  [36,79,"2. WHERE でしぼり込み"],
  [80,99,"3. 並べ替えと件数制限"],
  [100,114,"4. 集計関数"],
  [115,134,"5. GROUP BY"],
  [135,154,"6. テーブルの結合"],
  [155,174,"7. データの追加（INSERT）"],
  [175,194,"8. データの更新（UPDATE）"],
  [195,214,"9. データの削除（DELETE）"],
  [215,234,"10. テーブルの変更（ALTER）"],
];
const LEVELS = ["初級","中級","上級"];

const HINTS = [
  "SELECT 列1, 列2 FROM employees; の形です。列の順番は問題文どおりに。別名は「列 AS 新しい名前」、計算は + - * / が使えます。",
  "WHERE 条件 でしぼり込みます。比較は = <> > >= < <=、範囲は BETWEEN a AND b（外側は NOT BETWEEN）、複数条件は AND / OR。副問い合わせは WHERE dept_id = (SELECT id FROM departments WHERE ...) の形です。",
  "ORDER BY 列 ASC（小さい順）/ DESC（大きい順）。複数キーは ORDER BY a DESC, b ASC のようにカンマ区切り。件数をしぼるときは最後に LIMIT n。",
  "COUNT(*)、SUM(列)、AVG(列)、MAX(列)、MIN(列) を使い、AS で列名を付けます。種類を数えるときは COUNT(DISTINCT 列)。",
  "SELECT dept_id, 集計関数 AS 別名 FROM employees GROUP BY dept_id。グループをしぼるときは HAVING 集計関数 条件、並べ替えは ORDER BY 別名。",
  "FROM employees e JOIN departments d ON e.dept_id = d.id で結合。部署名は d.name AS dept_name。社員がいない部署も出すときは departments d LEFT JOIN employees e ON d.id = e.dept_id、いない判定は e.id IS NULL。",
  "INSERT INTO テーブル (列, ...) VALUES (値, ...); 複数行は VALUES (...), (...)。文字列は 'シングルクォート' で囲みます。2つの文は ; で区切って続けて書けます。",
  "UPDATE テーブル SET 列 = 値 WHERE 条件; 複数列は SET a = 1, b = 2。今の値を使うなら SET salary = salary + 500。他のテーブルを見るときは = (SELECT id FROM departments WHERE ...)。",
  "DELETE FROM テーブル WHERE 条件; WHERE を書かないと全部消えます。複数IDは WHERE id IN (1, 3, 5)。副問い合わせは WHERE dept_id = (SELECT ...) や NOT IN (SELECT ...)。",
  "列の追加: ALTER TABLE t ADD COLUMN 列 型 DEFAULT 値; 列名の変更: ALTER TABLE t RENAME COLUMN 旧 TO 新; テーブル名の変更: ALTER TABLE t RENAME TO 新しい名前;",
];

const TEXT = [
  ["SELECT の基本","テーブルから列を取り出す文です。列はカンマで区切り、問題文の順番どおりに書きます。","SELECT name, salary FROM employees;\nSELECT name AS employee_name FROM employees;\nSELECT name, salary * 12 AS annual_salary FROM employees;"],
  ["WHERE でしぼり込み","行を条件でしぼり込みます。条件を組み合わせるときは AND / OR、範囲は BETWEEN。副問い合わせは ( ) の中に別の SELECT を書きます。","SELECT name FROM employees WHERE salary >= 5000;\nSELECT name FROM employees WHERE age BETWEEN 25 AND 30;\nSELECT name FROM employees WHERE dept_id = 1 OR dept_id = 3;\nSELECT name FROM employees\n WHERE dept_id = (SELECT id FROM departments WHERE name = 'Sales');"],
  ["並べ替えと件数制限","ORDER BY で並べ替え、LIMIT で件数をしぼります。ASC が小さい順、DESC が大きい順です。","SELECT name, salary FROM employees ORDER BY salary DESC;\nSELECT name, age FROM employees ORDER BY age ASC LIMIT 2;\nSELECT name, dept_id, salary FROM employees ORDER BY dept_id ASC, salary DESC;"],
  ["集計関数","たくさんの行を1つの値にまとめます。結果の列名は AS で付けます。","SELECT COUNT(*) AS count FROM employees;\nSELECT AVG(salary) AS avg_salary FROM employees WHERE dept_id = 1;\nSELECT COUNT(DISTINCT dept_id) AS count FROM employees;"],
  ["GROUP BY","グループごとに集計します。グループ自体をしぼるときは WHERE ではなく HAVING を使います。","SELECT dept_id, COUNT(*) AS cnt FROM employees GROUP BY dept_id;\nSELECT dept_id, AVG(salary) AS avg_salary FROM employees\n GROUP BY dept_id HAVING AVG(salary) >= 5000;\nSELECT dept_id, SUM(salary) AS total_salary FROM employees\n GROUP BY dept_id ORDER BY total_salary DESC;"],
  ["テーブルの結合","2つのテーブルを ON の条件でつなぎます。JOIN は両方にある行だけ、LEFT JOIN は左のテーブルの行を全部残します。","SELECT e.name, d.name AS dept_name\n FROM employees e JOIN departments d ON e.dept_id = d.id;\nSELECT d.name AS dept_name, COUNT(e.id) AS cnt\n FROM departments d LEFT JOIN employees e ON d.id = e.dept_id\n GROUP BY d.name;\nSELECT d.name AS dept_name\n FROM departments d LEFT JOIN employees e ON d.id = e.dept_id\n WHERE e.id IS NULL;"],
  ["データの追加（INSERT）","行を追加します。列を省略するときはテーブルの列の順番どおりに値を書きます。","INSERT INTO employees VALUES (6, 'Frank', 3, 4800, 33);\nINSERT INTO employees (id, name, dept_id, salary, age) VALUES (6, 'Grace', 2, 6200, 29);\nINSERT INTO departments VALUES (4, 'Design'), (5, 'Legal');"],
  ["データの更新（UPDATE）","行の値を変えます。WHERE を忘れると全部の行が変わるので注意。","UPDATE employees SET salary = 4500 WHERE id = 2;\nUPDATE employees SET salary = salary + 500 WHERE salary < 5000;\nUPDATE employees SET salary = 5500, age = 31 WHERE id = 1;"],
  ["データの削除（DELETE）","行を消します。WHERE を書かないと全部消えます。","DELETE FROM employees WHERE id = 2;\nDELETE FROM employees WHERE id IN (1, 3, 5);\nDELETE FROM departments WHERE id NOT IN (SELECT dept_id FROM employees);"],
  ["テーブルの変更（ALTER）","テーブルの形そのものを変えます。列の追加、列名やテーブル名の変更ができます。","ALTER TABLE employees ADD COLUMN email TEXT;\nALTER TABLE employees ADD COLUMN active INTEGER DEFAULT 1;\nALTER TABLE employees RENAME COLUMN salary TO monthly_salary;\nALTER TABLE departments RENAME TO teams;"],
];

// [id, level(0/1/2), title, statement, reference SQL, flags] flags: o = order matters, s = start with Support dept
const P = [
[1,0,"全部の列を取得する","employees テーブルから、社員ID（id）、名前（name）、部署番号（dept_id）、給料（salary）、年れい（age）をこの順番で表示してください。","SELECT id, name, dept_id, salary, age FROM employees"],

[112,0,"給料5000以上の合計を求める","給料5000以上の合計を求める。結果は total_salary という列名で表示してください。","SELECT SUM(salary) AS total_salary FROM employees WHERE salary >= 5000"],
[113,0,"部署番号の種類を数える","部署番号の種類を数える。結果は count という列名で表示してください。","SELECT COUNT(DISTINCT dept_id) AS count FROM employees"],

[115,1,"部署ごとに人数を数える","部署番号（dept_id）ごとの値を、dept_id と cnt の列で表示してください。","SELECT dept_id, COUNT(*) AS cnt FROM employees GROUP BY dept_id"],
[116,1,"部署ごとに給料平均を求める","部署番号（dept_id）ごとの値を、dept_id と avg_salary の列で表示してください。","SELECT dept_id, AVG(salary) AS avg_salary FROM employees GROUP BY dept_id"],
[117,1,"部署ごとに給料合計を求める","部署番号（dept_id）ごとの値を、dept_id と total_salary の列で表示してください。","SELECT dept_id, SUM(salary) AS total_salary FROM employees GROUP BY dept_id"],
[118,1,"部署ごとにいちばん多い給料を求める","部署番号（dept_id）ごとの値を、dept_id と max_salary の列で表示してください。","SELECT dept_id, MAX(salary) AS max_salary FROM employees GROUP BY dept_id"],
[119,1,"部署ごとにいちばん少ない給料を求める","部署番号（dept_id）ごとの値を、dept_id と min_salary の列で表示してください。","SELECT dept_id, MIN(salary) AS min_salary FROM employees GROUP BY dept_id"],
[120,1,"部署ごとに年れいの合計を求める","部署番号（dept_id）ごとの値を、dept_id と total_age の列で表示してください。","SELECT dept_id, SUM(age) AS total_age FROM employees GROUP BY dept_id"],
[121,1,"部署ごとに年れいの平均を求める","部署番号（dept_id）ごとの値を、dept_id と avg_age の列で表示してください。","SELECT dept_id, AVG(age) AS avg_age FROM employees GROUP BY dept_id"],
[122,1,"部署ごとにいちばん高い年れいを求める","部署番号（dept_id）ごとの値を、dept_id と max_age の列で表示してください。","SELECT dept_id, MAX(age) AS max_age FROM employees GROUP BY dept_id"],
[123,1,"部署ごとにいちばん低い年れいを求める","部署番号（dept_id）ごとの値を、dept_id と min_age の列で表示してください。","SELECT dept_id, MIN(age) AS min_age FROM employees GROUP BY dept_id"],
[124,1,"部署ごとに人数と給料平均を出す","部署番号（dept_id）ごとに、人数（cnt）と給料平均（avg_salary）を dept_id と一緒に表示してください。","SELECT dept_id, COUNT(*) AS cnt, AVG(salary) AS avg_salary FROM employees GROUP BY dept_id"],
[125,1,"部署ごとに給料の最大と最小を出す","部署番号（dept_id）ごとに、いちばん多い給料（max_salary）といちばん少ない給料（min_salary）を dept_id と一緒に表示してください。","SELECT dept_id, MAX(salary) AS max_salary, MIN(salary) AS min_salary FROM employees GROUP BY dept_id"],
[126,1,"給料合計が多い部署順にならべる","部署番号（dept_id）ごとの給料合計（total_salary）を求め、合計が多い順（大きい順）にならべて、dept_id と total_salary を表示してください。","SELECT dept_id, SUM(salary) AS total_salary FROM employees GROUP BY dept_id ORDER BY total_salary DESC","o"],
[127,1,"最高給料が低い部署順にならべる","部署番号（dept_id）ごとのいちばん多い給料（max_salary）を求め、その値が小さい順にならべて、dept_id と max_salary を表示してください。","SELECT dept_id, MAX(salary) AS max_salary FROM employees GROUP BY dept_id ORDER BY max_salary ASC","o"],
[128,1,"平均年れいが高い部署順にならべる","部署番号（dept_id）ごとの年れいの平均（avg_age）を求め、平均が高い順にならべて、dept_id と avg_age を表示してください。","SELECT dept_id, AVG(age) AS avg_age FROM employees GROUP BY dept_id ORDER BY avg_age DESC","o"],
[129,2,"2人以上いる部署をしぼりこむ","人数が2人以上の部署だけを、dept_id と cnt の列で表示してください。","SELECT dept_id, COUNT(*) AS cnt FROM employees GROUP BY dept_id HAVING COUNT(*) >= 2"],
[130,2,"1人だけの部署をしぼりこむ","人数がちょうど1人の部署だけを、dept_id と cnt の列で表示してください。","SELECT dept_id, COUNT(*) AS cnt FROM employees GROUP BY dept_id HAVING COUNT(*) = 1"],
[131,2,"給料平均が高い部署をしぼりこむ","給料の平均が5000以上の部署だけを、dept_id と avg_salary の列で表示してください。","SELECT dept_id, AVG(salary) AS avg_salary FROM employees GROUP BY dept_id HAVING AVG(salary) >= 5000"],
[132,2,"給料合計が多い部署をしぼりこむ","給料の合計が10000以上の部署だけを、dept_id と total_salary の列で表示してください。","SELECT dept_id, SUM(salary) AS total_salary FROM employees GROUP BY dept_id HAVING SUM(salary) >= 10000"],
[133,2,"年れいが高い人がいる部署をしぼりこむ","いちばん高い年れいが35以上の部署だけを、dept_id と max_age の列で表示してください。","SELECT dept_id, MAX(age) AS max_age FROM employees GROUP BY dept_id HAVING MAX(age) >= 35"],
[134,2,"給料がみんな高い部署をしぼりこむ","いちばん少ない給料が5000以上の部署だけを、dept_id と min_salary の列で表示してください。","SELECT dept_id, MIN(salary) AS min_salary FROM employees GROUP BY dept_id HAVING MIN(salary) >= 5000"],

[135,1,"社員名と部署名を表示する","各社員の名前（name）と部署名（dept_name）を表示してください。","SELECT e.name, d.name AS dept_name FROM employees e JOIN departments d ON e.dept_id = d.id"],
[136,1,"社員名・部署名・給料を表示する","各社員の名前（name）・部署名（dept_name）・給料（salary）を表示してください。","SELECT e.name, d.name AS dept_name, e.salary FROM employees e JOIN departments d ON e.dept_id = d.id"],
[137,1,"Engineeringの社員を表示する","Engineering 部門で働く社員の名前（name）を表示してください。","SELECT e.name FROM employees e JOIN departments d ON e.dept_id = d.id WHERE d.name = 'Engineering'"],
[138,1,"Salesの社員を表示する","Sales 部門で働く社員の名前（name）を表示してください。","SELECT e.name FROM employees e JOIN departments d ON e.dept_id = d.id WHERE d.name = 'Sales'"],
[139,1,"HRの社員を表示する","HR 部門で働く社員の名前（name）を表示してください。","SELECT e.name FROM employees e JOIN departments d ON e.dept_id = d.id WHERE d.name = 'HR'"],
[140,1,"Aliceの部署名を調べる","Alice さんの部署名（dept_name）を表示してください。","SELECT d.name AS dept_name FROM employees e JOIN departments d ON e.dept_id = d.id WHERE e.name = 'Alice'"],
[141,1,"給料5000以上の社員と部署を表示する","給料が5000以上の社員の名前（name）と部署名（dept_name）を表示してください。","SELECT e.name, d.name AS dept_name FROM employees e JOIN departments d ON e.dept_id = d.id WHERE e.salary >= 5000"],
[142,1,"30才より若い社員と部署を表示する","年れいが30才より若い社員の名前（name）と部署名（dept_name）を表示してください。","SELECT e.name, d.name AS dept_name FROM employees e JOIN departments d ON e.dept_id = d.id WHERE e.age < 30"],
[143,1,"HR以外の社員と部署を表示する","HR 以外の部署で働く社員の名前（name）と部署名（dept_name）を表示してください。","SELECT e.name, d.name AS dept_name FROM employees e JOIN departments d ON e.dept_id = d.id WHERE d.name <> 'HR'"],
[144,2,"Engineeringで給料6000より上の社員","Engineering 部門で、給料が6000より多い社員の名前（name）を表示してください。","SELECT e.name FROM employees e JOIN departments d ON e.dept_id = d.id WHERE d.name = 'Engineering' AND e.salary > 6000"],
[145,2,"給料が多い順に社員と部署をならべる","社員の名前（name）と部署名（dept_name）を、給料が多い順（大きい順）にならべて表示してください。","SELECT e.name, d.name AS dept_name FROM employees e JOIN departments d ON e.dept_id = d.id ORDER BY e.salary DESC","o"],
[146,2,"部署名の順に社員をならべる","社員の名前（name）と部署名（dept_name）を、部署名のアルファベット順、同じ部署では名前のアルファベット順にならべて表示してください。","SELECT e.name, d.name AS dept_name FROM employees e JOIN departments d ON e.dept_id = d.id ORDER BY d.name ASC, e.name ASC","o"],
[147,2,"部署名ごとに人数を数える","部署名（dept_name）ごとの人数を、dept_name と cnt の列で表示してください。","SELECT d.name AS dept_name, COUNT(*) AS cnt FROM employees e JOIN departments d ON e.dept_id = d.id GROUP BY d.name"],
[148,2,"部署名ごとに給料平均を求める","部署名（dept_name）ごとの給料平均を、dept_name と avg_salary の列で表示してください。","SELECT d.name AS dept_name, AVG(e.salary) AS avg_salary FROM employees e JOIN departments d ON e.dept_id = d.id GROUP BY d.name"],
[149,2,"部署名ごとに給料合計を求める","部署名（dept_name）ごとの給料合計を、dept_name と total_salary の列で表示してください。","SELECT d.name AS dept_name, SUM(e.salary) AS total_salary FROM employees e JOIN departments d ON e.dept_id = d.id GROUP BY d.name"],
[150,2,"部署名ごとにいちばん多い給料を求める","部署名（dept_name）ごとのいちばん多い給料を、dept_name と max_salary の列で表示してください。","SELECT d.name AS dept_name, MAX(e.salary) AS max_salary FROM employees e JOIN departments d ON e.dept_id = d.id GROUP BY d.name"],
[151,2,"2人以上の部署名をしぼりこむ","人数が2人以上の部署名だけを、dept_name と cnt の列で表示してください。","SELECT d.name AS dept_name, COUNT(*) AS cnt FROM employees e JOIN departments d ON e.dept_id = d.id GROUP BY d.name HAVING COUNT(*) >= 2"],
[152,2,"社員がいない部署も全部出す","すべての部署名（dept_name）と、その部署の社員名（member）を表示してください。社員がいない部署（Support）も、member を空（NULL）にして必ず表示してください。","SELECT d.name AS dept_name, e.name AS member FROM departments d LEFT JOIN employees e ON d.id = e.dept_id","s"],
[153,2,"社員0人の部署も人数を出す","部署名（dept_name）ごとの人数を、dept_name と cnt の列で表示してください。社員がいない部署（Support）は cnt を 0 にしてください。","SELECT d.name AS dept_name, COUNT(e.id) AS cnt FROM departments d LEFT JOIN employees e ON d.id = e.dept_id GROUP BY d.name","s"],
[154,2,"社員がいない部署を見つける","社員が1人もいない部署名（dept_name）を表示してください。","SELECT d.name AS dept_name FROM departments d LEFT JOIN employees e ON d.id = e.dept_id WHERE e.id IS NULL","s"],

CodeMirror.defineMode("sqlx", function(){
  const KW = new Set(("select from where and or not in between like is null as order by asc desc limit offset group having "+
    "join left right inner outer full cross on using insert into values update set delete alter table add column rename to "+
    "default distinct exists case when then else end union all create drop primary key integer text real true false").split(" "));
  const FN = new Set("count sum avg max min abs round upper lower length coalesce ifnull".split(" "));
  return {
    startState(){ return { inComment:false }; },
    token(stream, st){
      if (st.inComment) { if (stream.match(/^.*?\*\//)) st.inComment = false; else stream.skipToEnd(); return "comment"; }
      if (stream.eatSpace()) return null;
      if (stream.match(/^--.*/)) return "comment";
      if (stream.match(/^\/\*/)) { st.inComment = true; if (stream.match(/^.*?\*\//)) st.inComment = false; else stream.skipToEnd(); return "comment"; }
      if (stream.match(/^'(?:[^']|'')*'?/)) return "string";
      if (stream.match(/^"[^"]*"?/)) return "variable-2";
      if (stream.match(/^\d+(?:\.\d+)?/)) return "number";
      if (stream.match(/^[A-Za-z_][A-Za-z0-9_]*/)) {
        const w = stream.current().toLowerCase();
        if (KW.has(w)) return "keyword";
        if (FN.has(w) && stream.peek() === "(") return "builtin";
        return "variable";
      }
      if (stream.match(/^(?:<>|<=|>=|!=|=|<|>|\+|-|\*|\/|%|\|\|)/)) return "operator";
      if (stream.match(/^[(),;.]/)) return "punctuation";
      stream.next(); return null;
    },
    lineComment: "--"
  };
});

      if (st.inComment) { if (stream.match(/^.*?-->/)) st.inComment = false; else stream.skipToEnd(); return "comment"; }
      if (st.inTag) {
        if (stream.eatSpace()) return null;
        if (stream.match(/^\/?>/)) { st.inTag = false; if (st.styleNext) { st.inStyle = true; st.styleNext = false; } return "keyword"; }
        if (stream.match(/^"[^"]*"?|^'[^']*'?/)) return "string";
        if (stream.match(/^=/)) return "operator";
        if (stream.match(/^[A-Za-z_:][\w:.-]*/)) return "variable";
        stream.next(); return null;
      }
      if (st.inStyle) {
        if (stream.match(/^<\/style\s*>/i)) { st.inStyle = false; return "keyword"; }
        if (stream.eatSpace()) return null;
        if (stream.match(/^\/\*.*?\*\//)) return "comment";
        if (stream.match(/^"[^"]*"?|^'[^']*'?/)) return "string";
        if (stream.match(/^#[0-9a-fA-F]{3,8}\b/)) return "number";
        if (stream.match(/^-?\d+(?:\.\d+)?(?:px|em|rem|%|vh|vw|s|ms|deg)?/)) return "number";
        if (stream.match(/^[A-Za-z-]+(?=\s*:)/)) return "builtin";
        if (stream.match(/^[.#]?[A-Za-z_-][\w-]*/)) return "variable";
        if (stream.match(/^[{}:;,()]/)) return "punctuation";
        stream.next(); return null;
      }
      if (stream.match(/^<!--/)) { st.inComment = true; if (stream.match(/^.*?-->/)) st.inComment = false; else stream.skipToEnd(); return "comment"; }
      if (stream.match(/^<!DOCTYPE[^>]*>/i)) return "builtin";
      if (stream.match(/^<\/?[A-Za-z][\w-]*/)) { const tag = stream.current().replace(/^<\/?/, "").toLowerCase(); st.inTag = true; st.styleNext = (tag === "style" && !stream.current().startsWith("</")); return "keyword"; }
      if (stream.match(/^[^<]+/)) return null;
      stream.next(); return null;
    }
  };
});

/* ===================== SQL ENGINE ===================== */
let SQLJS = null;
function freshDb(setup){ const db = new SQLJS.Database(); db.exec(SEED); if (setup) db.exec(setup); return db; }
function lastResult(res){ return res.length ? res[res.length-1] : {columns:[], values:[]}; }
function snapshot(db){
  const tb = db.exec("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name");
  const names = tb.length ? tb[0].values.map(r => r[0]) : [];
  return names.map(n => {
    const r = db.exec('SELECT * FROM "' + n.replace(/"/g,'""') + '"');
    if (r.length) return { name:n, cols:r[0].columns, rows:r[0].values };
    const pr = db.exec('PRAGMA table_info("' + n.replace(/"/g,'""') + '")');
    return { name:n, cols: pr.length ? pr[0].values.map(v => v[1]) : [], rows:[] };
  });
}
const norm = v => (typeof v === "number" && !Number.isInteger(v)) ? Math.round(v*1e6)/1e6 : v;
const rowKeys = (rows, ordered) => { const k = rows.map(r => JSON.stringify(r.map(norm))); return ordered ? k : k.slice().sort(); };
const same = (a,b) => JSON.stringify(a) === JSON.stringify(b);

function gradeSql(problem, userSql){
  const dbU = freshDb(problem.setup), dbE = freshDb(problem.setup);
  let result;
  try {
    if (problem.kind === "select") {
      const mine = lastResult(dbU.exec(userSql));
      const exp = lastResult(dbE.exec(problem.sql));
      const c1 = same(mine.columns, exp.columns);
      const c2 = mine.values.length === exp.values.length;
      const c3 = same(rowKeys(mine.values, problem.ordered), rowKeys(exp.values, problem.ordered));
      result = { checks:[
        { label:t("c_cols"), ok:c1, mine:mine.columns.join(", ") || t("none"), exp:exp.columns.join(", "), note:t("c_cols_note") },
        { label:t("c_rows"), ok:c2, mine:t("rows")(mine.values.length), exp:t("rows")(exp.values.length), note:t("c_rows_note") },
        { label:t("c_vals"), ok:c3, note: problem.ordered ? t("c_vals_note_o") : t("c_vals_note") },
      ], outputHtml: "<h4>" + esc(t("output")) + '</h4><div class="out">' + esc(outText(mine.columns, mine.values)) + "</div>" };
    } else {
      dbU.exec(userSql); dbE.exec(problem.sql);
      const mine = snapshot(dbU), exp = snapshot(dbE);
      const sameTables = same(mine.map(x => x.name), exp.map(x => x.name));
      const c1 = sameTables && mine.every((x,i) => same(x.cols, exp[i].cols));
      const c2 = sameTables && mine.every((x,i) => x.rows.length === exp[i].rows.length);
      const c3 = sameTables && mine.every((x,i) => same(rowKeys(x.rows,false), rowKeys(exp[i].rows,false)));
      const desc = s => s.map(x => x.name + "(" + x.cols.join(", ") + ")").join(" / ");
      const cnt = s => s.map(x => x.name + ": " + t("rows")(x.rows.length)).join(" / ");
      result = { checks:[
        { label:t("c_struct"), ok:c1, mine:desc(mine), exp:desc(exp), note:t("c_struct_note") },
        { label:t("c_rows"), ok:c2, mine:cnt(mine), exp:cnt(exp), note:t("c_rows_note_dml") },
        { label:t("c_data"), ok:c3, note:t("c_vals_note") },
      ], outputHtml: "<h4>" + esc(t("output")) + "</h4>" + snapHtml(mine) };
    }
    result.score = (result.checks[0].ok?33:0) + (result.checks[1].ok?33:0) + (result.checks[2].ok?34:0);
    result.error = null;
  } catch (e) {
    result = { error: String(e.message || e), score:0, checks:[], outputHtml:"" };
  }
  dbU.close(); dbE.close();
  return result;
}
function expected(problem){
  const db = freshDb(problem.setup);
  let out;
  try {
    if (problem.kind === "select") out = { kind:"select", res: lastResult(db.exec(problem.sql)) };
    else { db.exec(problem.sql); out = { kind:"dml", snap: snapshot(db) }; }
  } finally { db.close(); }
  return out;
}
function initialSnapshot(problem){ const db = freshDb(problem.setup); const s = snapshot(db); db.close(); return s; }

/* ===================== JAVA ENGINE (no JVM: output prediction + shape checks) ===================== */
const cleanLines = s => { const a = s.replace(/\r/g,"").split("\n").map(l => l.replace(/\s+$/,"")); while (a.length && a[a.length-1] === "") a.pop(); return a; };
function gradeJava(problem, text){
  if (problem.type === "output") {
    const mine = cleanLines(text), exp = cleanLines(problem.answer);
    const c1 = mine.length === exp.length;
    const c2 = c1 && mine.every((l,i) => l.trim() === exp[i].trim());
    const c3 = c1 && mine.every((l,i) => l === exp[i]);
    return { error:null, score:(c1?33:0)+(c2?33:0)+(c3?34:0), checks:[
      { label:t("c_lines"), ok:c1, mine:t("rows")(mine.length), exp:t("rows")(exp.length), note:t("c_lines_note") },
      { label:t("c_trim"), ok:c2, note:t("c_trim_note") },
      { label:t("c_exact"), ok:c3, note:t("c_exact_note") },
    ], outputHtml: "<h4>" + esc(t("output")) + '</h4><div class="out">' + esc(mine.join("\n") || t("none")) + "</div>" };
  }
  const checks = problem.checks.map(c => ({ label:chkText(c), ok: c.not ? !c.re.test(text) : c.re.test(text) }));
  const n = checks.filter(c => c.ok).length;
  return { error:null, score: n === checks.length ? 100 : Math.floor(n / checks.length * 100), checks, outputHtml:"" };
}

/* ===================== WEB ENGINE (HTML/CSS rendered in an iframe) ===================== */
function gradeWeb(problem, code, iframe){
  return new Promise(resolve => {
    let done = false;
    const finish = () => {
      if (done) return; done = true;
      let checks;
      try {
        const d = iframe.contentDocument, w = iframe.contentWindow;
        checks = problem.checks.map(c => { let ok = false; try { ok = !!c.test(d, w); } catch(e){} return { label:chkText(c), ok }; });
      } catch (e) { resolve({ error:String(e.message || e), score:0, checks:[], outputHtml:"" }); return; }
      const n = checks.filter(c => c.ok).length;
      resolve({ error:null, score: n === checks.length ? 100 : Math.floor(n / checks.length * 100), checks, outputHtml:"" });
    };
    iframe.onload = () => setTimeout(finish, 30);
    iframe.srcdoc = code;
    setTimeout(finish, 1500); // safety net if load never fires
  });
}

/* ===================== LOGIN ===================== */
function renderLogin(){
  document.title = t("app");
  $("#app").innerHTML = `
  <div class="login">
    <div style="display:flex;justify-content:space-between;align-items:center"><h1>${esc(t("app"))}</h1>${langBtn()}</div>
    <p>${esc(t("tagline_login"))}</p>
    <label class="field"><span>${esc(t("name"))}</span><input id="in-name" placeholder="${esc(t("name_ph"))}" autocomplete="off"></label>
    <label class="field"><span>${esc(t("sid"))}</span><input id="in-sid" placeholder="${esc(t("sid_ph"))}" autocomplete="off"></label>
    <button class="btn primary" id="btn-login" style="width:100%;padding:11px">${esc(t("start"))}</button>
  </div>`;
  const start = () => {
    const name = $("#in-name").value.trim();
    if (!name) { $("#in-name").focus(); return; }
    user = { name, sid: $("#in-sid").value.trim() };
    localStorage.setItem(KEY_USER, JSON.stringify(user));
    loadData(); go("#/"); route();
  };
  $("#btn-login").onclick = start;
  $("#in-name").addEventListener("keydown", e => { if (e.key === "Enter") start(); });
  $("#in-sid").addEventListener("keydown", e => { if (e.key === "Enter") start(); });
  bindLang();
  $("#in-name").focus();
}
function logout(){ user = null; data = null; localStorage.removeItem(KEY_USER); go("#/"); route(); }

/* ===================== HOME ===================== */
let hideFull = false;
function renderHome(){
  const c = course(), st = store(c.key), TOTALC = c.problems.length;
  const solved = solvedCount(st), lv = level(st);
  if (lv > st.maxLevel) { st.maxLevel = lv; saveData(); }
  const initial = user.name.trim().charAt(0).toUpperCase();
  document.title = c.name + " Training";
  const listHtml = c.sections.map((_, si) => {
    const all = c.problems.filter(p => p.section === si);
    const remaining = all.filter(p => (st.progress[p.id]?.best ?? 0) < 100).length;
    const shown = hideFull ? all.filter(p => (st.progress[p.id]?.best ?? 0) < 100) : all;
    if (!shown.length) return "";
    return `<div class="sec"><h3>${esc(secName(c, si))}</h3><span>${esc(t("left")(remaining))}</span></div>` +
      shown.map(p => `
      <button class="prob" data-id="${p.id}">
        <div class="r1"><span class="num">#${p.id}</span><span class="ttl">${esc(pTitle(p))}</span>${lvPill(p.lv)}</div>
        <div class="r2"><div class="desc">${esc(pDesc(p)).replace(/\n/g," ")}</div><div class="st">${statusPills(st, p.id)}</div></div>
      </button>`).join("");
  }).join("");
  const shownTotal = hideFull ? c.problems.filter(p => (st.progress[p.id]?.best ?? 0) < 100).length : TOTALC;

  $("#app").innerHTML = `
  <header class="top"><div class="in">
    <div><h1>${c.name} Training</h1><div class="sub">${esc(t("tagline")[c.key])}</div></div>
    <nav class="nav">
      <a href="#/playground">${esc(t("playground"))}</a>
      <a href="#/text">${esc(t("textbook"))}</a>
      <span class="who">${esc(user.sid)} <b>${esc(user.name)}</b></span>
      ${langBtn()}
      <button class="btn" id="btn-logout">${esc(t("logout"))}</button>
    </nav>
    ${tabsHtml()}
  </div></header>
  <main class="home">
    <aside class="card status">
      <div class="lbl">${esc(t("cur_level"))} · ${c.name}</div>
      <div class="lvrow">
        <div><div class="lvbig">Lv. ${lv}</div><div class="lvmax">${esc(t("best_lv")(st.maxLevel))}</div></div>
        <div class="left"><div class="t">${esc(t("remaining"))}</div><div class="n">${esc(t("nq")(TOTALC - solved))}</div></div>
      </div>
      <div class="avatar"><span class="badge">Lv. ${lv}</span><span class="init">${esc(initial)}</span></div>
      <div class="next"><div class="t">${esc(t("to_next"))}</div><div class="n">${toNext(st)}<small>${esc(t("unit"))}</small></div></div>
      <div class="prog">
        <div class="lbl">${esc(t("progress"))}</div>
        <div class="n">${solved}<small>/ ${TOTALC}</small></div>
        <div class="bar"><i style="width:${TOTALC ? (solved/TOTALC*100).toFixed(1) : 0}%"></i></div>
        <div class="note">${esc(t("lv_note"))}</div>
      </div>
      <hr>
      <button class="btn danger" id="btn-reset" style="width:100%">${esc(t("random_reset"))}</button>
      <div class="reset-row"><span>${esc(t("reset_count"))}</span><b>${esc(t("nq")(st.resetCount))}</b></div>
      <div class="note" style="margin-top:6px">${esc(t("reset_note"))}</div>
      <hr>
      <div class="lbl">${esc(t("backup"))}</div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn sm" id="btn-export" style="flex:1">${esc(t("export"))}</button>
        <button class="btn sm" id="btn-import" style="flex:1">${esc(t("import_"))}</button>
        <input type="file" id="file-import" accept="application/json,.json" style="display:none">
      </div>
    </aside>
    <section>
      ${c.ready ? "" : '<div class="soon-box">'+esc(t("soon_note"))+'</div>'}${c.key === "java" ? '<div class="note" style="margin-bottom:12px">'+esc(t("java_note"))+'</div>' : ""}
      <div class="listhead">
        <div><h2>${esc(t("problems"))}</h2><div class="cnt">${esc(t("n_problems")(shownTotal))}</div></div>
        <button class="btn" id="btn-filter">${esc(hideFull ? t("show_all") : t("hide_full"))}</button>
      </div>
      ${listHtml || '<div class="empty">'+esc(t("all_full"))+'</div>'}
    </section>
  </main>`;
  $("#btn-logout").onclick = logout;
  $("#btn-filter").onclick = () => { hideFull = !hideFull; renderHome(); };
  $("#btn-reset").onclick = () => {
    const full = c.problems.filter(p => st.progress[p.id]?.best === 100);
    if (!full.length) { toast(t("no_reset")); return; }
    const pick = full[Math.floor(Math.random()*full.length)];
    delete st.progress[pick.id]; st.resetCount++; saveData();
    renderHome(); toast(t("reset_done")(pick.id));
  };
  $("#btn-export").onclick = () => {
    const blob = new Blob([JSON.stringify({ user, data, exportedAt: new Date().toISOString() }, null, 2)], { type:"application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "code-training-" + user.name + ".json"; a.click(); URL.revokeObjectURL(a.href);
  };
  $("#btn-import").onclick = () => $("#file-import").click();
  $("#file-import").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { const j = JSON.parse(rd.result); if (!j.data || !j.data.progress) throw 0; data = j.data; if (!data.courses) data.courses = {}; saveData(); renderHome(); toast(t("imported")); } catch (x) { toast(t("import_fail")); } };
    rd.readAsText(f);
  };
  bindLang(); bindTabs();
  document.querySelectorAll(".prob").forEach(b => b.onclick = () => go(problemHash(c.key, +b.dataset.id)));
}

/* ===================== PROBLEM ===================== */
function renderProblem(c, p){
  const st = store(c.key);
  const best = st.progress[p.id]?.best;
  const draft = st.drafts[p.id] ?? starterFor(c, p);
  const idx = c.problems.indexOf(p), prevP = c.problems[idx-1], nextP = c.problems[idx+1];
  const solvedStyle = 'style="background:var(--green);border-color:var(--green)"';
  document.title = "#" + p.id + " " + pTitle(p) + " · " + c.name;

  // per-course extras
  let leftExtra = "", edHead = "SQL", edFoot = t("tables"), rightExtra = "";
  if (c.kind === "sql") {
    const exp = expected(p), init = initialSnapshot(p);
    leftExtra = `<h4>${esc(t("target"))}</h4><div class="note" style="margin-bottom:8px">${esc(exp.kind === "select" ? t("target_sel") : t("target_dml"))}</div>` +
      (exp.kind === "select" ? tableHtml(exp.res.columns, exp.res.values) : snapHtml(exp.snap));
    rightExtra = `<hr><h4>${esc(t("dbcontents"))}</h4><div class="note" style="margin-bottom:6px">${esc(t("db_note"))}</div>${snapHtml(init)}`;
  } else if (c.kind === "java") {
    if (p.type === "output") { leftExtra = `<h4>${esc(t("code"))}</h4><div class="code">${esc(p.code)}</div>` + (p.input != null ? `<h4>${esc(t("input_lbl"))}</h4><div class="code">${esc(p.input)}</div>` : ""); edHead = t("output_lbl"); edFoot = t("java_out_hint"); }
    else { leftExtra = `<h4>${esc(t("requirements"))}</h4><ul class="req">${p.checks.map(x => "<li>"+esc(chkText(x))+"</li>").join("")}</ul>`; edHead = "Java"; edFoot = "Main.java"; }
  } else {
    leftExtra = `<h4>${esc(t("requirements"))}</h4><ul class="req">${p.checks.map(x => "<li>"+esc(chkText(x))+"</li>").join("")}</ul>`;
    edHead = "HTML"; edFoot = "index.html";
    rightExtra = `<hr><h4>${esc(t("preview"))}</h4><iframe class="preview" id="preview" title="preview" sandbox="allow-same-origin"></iframe>`;
  }

  $("#app").innerHTML = `
  <div class="pbar">
    <button class="btn" id="btn-back">${esc(t("back"))}</button>
    <div><div class="ttl">#${p.id} ${esc(pTitle(p))}</div><div class="sc" id="cur-score">${c.name} · ${esc(t("cur_score"))}${best == null ? esc(t("not_submitted")) : esc(t("pts")(best))}</div></div>
    <div class="sp"></div>
    <span class="who">${esc(user.sid)} ${esc(user.name)}</span>
    ${langBtn()}
    <button class="btn" id="btn-logout">${esc(t("logout"))}</button>
    <button class="btn" id="btn-prev" ${prevP ? "" : "disabled"}>${esc(t("prev"))}</button>
    <button class="btn" id="btn-draft">${esc(t("save_draft"))}</button>
    <button class="btn primary" id="btn-run" ${best === 100 ? solvedStyle : ""}>${esc(best === 100 ? t("solved") : t("run_submit"))}</button>
    <button class="btn" id="btn-next" ${nextP ? "" : "disabled"}>${esc(t("next"))}</button>
    <button class="btn danger" id="btn-clear">${esc(t("clear"))}</button>
  </div>
  <div class="work">
    <div class="col l">
      <h4>${esc(t("problem"))}</h4>
      <div style="margin-bottom:8px">${lvPill(p.lv)}</div>
      <div class="statement">${esc(pDesc(p))}</div>
      <a class="btn sm" href="#/text" style="display:inline-block">${esc(t("learn"))}</a>
      <div class="hint" id="hint">
        <div class="h"><span>${esc(t("hint"))}</span><button class="btn ghost sm" id="btn-hint">${esc(t("show"))}</button></div>
        <div class="body">${esc(hintOf(c, p.section))}</div>
      </div>
      ${leftExtra}
    </div>
    <div class="col c">
      <div class="ed-head">${esc(edHead)}</div>
      <div class="ed-wrap"><textarea id="sql"></textarea></div>
      <div class="ed-foot"><span>${esc(edFoot)}</span><span>${esc(t("run_key"))}</span></div>
    </div>
    <div class="col r">
      <div id="grade-area"><h4>${esc(t("result"))}</h4><div class="placeholder">${esc(t("result_ph"))}</div></div>
      ${rightExtra}
    </div>
  </div>`;

  editor = CodeMirror.fromTextArea($("#sql"), { mode: modeFor(c, p), theme:"sqlx", styleActiveLine:true, lineNumbers:true, lineWrapping:true, indentWithTabs:false, tabSize:2 });
  editor.setValue(draft);
  editor.on("change", () => { st.drafts[p.id] = editor.getValue(); saveData(); });
  editor.setOption("extraKeys", { "Cmd-Enter": submit, "Ctrl-Enter": submit });
  setTimeout(() => { editor.refresh(); editor.focus(); if (c.kind === "sql") editor.setCursor(editor.lineCount(), 0); }, 0);
  if (c.kind === "web") { const f = $("#preview"); if (f) f.srcdoc = draft; }

  async function submit(){
    const code = editor.getValue();
    let r;
    if (c.kind === "sql") r = gradeSql(p, code);
    else if (c.kind === "java") r = gradeJava(p, code);
    else r = await gradeWeb(p, code, $("#preview"));
    const box = $("#grade-area");
    let html = "<h4>" + esc(t("result")) + "</h4>";
    if (r.error) {
      html += '<div class="err">' + esc(t("error")) + "\n" + esc(r.error) + "</div>";
    } else {
      html += '<div class="score" style="color:' + (r.score === 100 ? "var(--green)" : r.score ? "var(--ink)" : "var(--red)") + '">' + r.score + "<small>" + esc(lang === "ja" ? "点" : " pts") + "</small></div>";
      if (c.kind !== "sql" && !(c.kind === "java" && p.type === "output")) html += '<div class="note" style="margin-bottom:8px">' + esc(t("passed")(r.checks.filter(x => x.ok).length, r.checks.length)) + "</div>";
      html += checksHtml(r.checks) + (r.outputHtml || "");
      const prev = st.progress[p.id] || { best:0, attempts:0 };
      st.progress[p.id] = { best: Math.max(prev.best, r.score), attempts: prev.attempts + 1, at: Date.now() };
      const lv = level(st); if (lv > st.maxLevel) st.maxLevel = lv;
      saveData();
      $("#cur-score").textContent = c.name + " · " + t("cur_score") + t("pts")(st.progress[p.id].best);
      if (r.score === 100) { toast(t("perfect")(lv)); const b = $("#btn-run"); b.textContent = t("solved"); b.style.background = "var(--green)"; b.style.borderColor = "var(--green)"; }
    }
    box.innerHTML = html; box.parentElement.scrollTop = 0;
  }

  $("#btn-run").onclick = submit;
  $("#btn-back").onclick = () => go("#/");
  $("#btn-logout").onclick = logout;
  $("#btn-prev").onclick = () => prevP && go(problemHash(c.key, prevP.id));
  $("#btn-next").onclick = () => nextP && go(problemHash(c.key, nextP.id));
  $("#btn-draft").onclick = () => { st.drafts[p.id] = editor.getValue(); saveData(); toast(t("draft_saved")); };
  $("#btn-clear").onclick = () => { editor.setValue(starterFor(c, p)); delete st.drafts[p.id]; saveData(); editor.focus(); if (c.kind === "sql") editor.setCursor(editor.lineCount(), 0); if (c.kind === "web") $("#preview").srcdoc = editor.getValue(); };
  $("#btn-hint").onclick = () => { const h = $("#hint"); h.classList.toggle("open"); $("#btn-hint").textContent = h.classList.contains("open") ? t("hide") : t("show"); };
  bindLang();
}

/* ===================== PLAYGROUND (SQL) ===================== */
let pgDb = null;
function renderPlayground(){
  if (!pgDb) pgDb = freshDb("");
  document.title = t("playground");
  $("#app").innerHTML = `
  <div class="pbar">
    <button class="btn" id="btn-back">${esc(t("back"))}</button>
    <div><div class="ttl">${esc(t("playground"))}</div><div class="sc">${esc(t("pg_sub"))}</div></div>
    <div class="sp"></div>
    ${langBtn()}
    <button class="btn" id="btn-pgreset">${esc(t("reset_db"))}</button>
    <button class="btn primary" id="btn-run">${esc(t("run"))}</button>
  </div>
  <div class="pg">
    <div class="col c">
      <div class="ed-head">SQL</div>
      <div class="ed-wrap"><textarea id="sql"></textarea></div>
      <div class="ed-foot"><span>${esc(t("tables"))}</span><span>${esc(t("run_key"))}</span></div>
    </div>
    <div class="col r" id="results"><h4>${esc(t("result"))}</h4><div class="placeholder">${esc(t("pg_ph"))}</div><hr><h4>${esc(t("dbcontents"))}</h4>${snapHtml(snapshot(pgDb))}</div>
  </div>`;
  editor = CodeMirror.fromTextArea($("#sql"), { mode:"sqlx", theme:"sqlx", styleActiveLine:true, lineNumbers:true, lineWrapping:true, tabSize:2 });
  editor.setValue("SELECT * FROM employees;\n");
  editor.setOption("extraKeys", { "Cmd-Enter": run, "Ctrl-Enter": run });
  setTimeout(() => { editor.refresh(); editor.focus(); }, 0);
  function run(){
    let html = "<h4>" + esc(t("result")) + "</h4>";
    try {
      const res = pgDb.exec(editor.getValue());
      html += res.length ? res.map(r => '<div class="out">' + esc(outText(r.columns, r.values)) + "</div>").join("") : '<div class="placeholder">' + esc(t("ran_none")) + '</div>';
    } catch (e) { html += '<div class="err">' + esc(t("error")) + "\n" + esc(e.message) + "</div>"; }
    html += "<hr><h4>" + esc(t("dbcontents")) + "</h4>" + snapHtml(snapshot(pgDb));
    $("#results").innerHTML = html;
  }
  $("#btn-run").onclick = run;
  $("#btn-back").onclick = () => go("#/");
  $("#btn-pgreset").onclick = () => { pgDb.close(); pgDb = freshDb(""); run(); toast(t("db_reset")); };
  bindLang();
}

/* ===================== TEXT ===================== */
function renderText(){
  const c = course();
  document.title = t("textbook") + " · " + c.name;
  const lessons = c.text.map(([tj, bj, code], i) => {
    const title = lang === "ja" ? tj : c.textEn[i][0];
    const body = lang === "ja" ? bj : c.textEn[i][1];
    return `<div class="lesson"><h3>${i+1}. ${esc(title)}</h3><p>${esc(body)}</p><pre>${esc(code)}</pre></div>`;
  }).join("");
  $("#app").innerHTML = `
  <div class="pbar"><button class="btn" id="btn-back">${esc(t("back"))}</button><div class="ttl">${esc(t("textbook"))} · ${c.name}</div><div class="sp"></div>${langBtn()}</div>
  <div class="page">${tabsHtml()}${lessons}</div>`;
  $("#btn-back").onclick = () => go("#/");
  bindLang();
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { setCourse(b.dataset.course); renderText(); });
}

/* ===================== BOOT ===================== */
initSqlJs({ locateFile: f => "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/" + f }).then(m => {
  SQLJS = m;
  try { user = JSON.parse(localStorage.getItem(KEY_USER)); } catch(e){ user = null; }
  if (user) loadData();
  route();
}).catch(e => { $("#app").innerHTML = '<div class="loading">' + esc(t("load_fail")) + esc(e.message) + "</div>"; });

</script>
